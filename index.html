<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c64d27" />

    <!-- Primary Meta Tags -->
    <!--
      El <title>, <meta name="description"> y <link rel="canonical"> se definen
      por página con el componente <Seo> (src/components/Seo/Seo.jsx), usando el
      hoisting nativo de React 19. NO agregar aquí versiones estáticas: duplicarían
      el canonical y el título en cada ruta. Googlebot renderiza el JS y los lee.
      Las etiquetas Open Graph / Twitter de abajo SÍ son estáticas a propósito:
      los scrapers de redes (Facebook, WhatsApp, X) no ejecutan JavaScript.

      Dominio: todas las URL absolutas usan https://www.inconsarq.com, que es el
      que sirve el sitio (Vercel redirige inconsarq.com → www). Mantener igual
      que `domain` en src/config/site.js, sitemap.xml y robots.txt.
    -->
    <title>INCONSARQ — Ingeniería, Construcción y Arquitectura | Arequipa, Perú</title>
    <meta name="keywords" content="ingeniería, construcción, arquitectura, geosintéticos, HDPE, termofusión, Arequipa, Perú, supervisión de obras, expedientes técnicos, saneamiento físico-legal, topografía, minería" />
    <meta name="author" content="INCONSARQ" />
    <meta name="robots" content="index, follow" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.inconsarq.com/" />
    <meta property="og:title" content="INCONSARQ — Ingeniería, Construcción y Arquitectura" />
    <meta property="og:description" content="Especialistas en geosintéticos, tuberías HDPE, obras civiles y consultoría. +10 años construyendo confianza en Arequipa, Perú." />
    <meta property="og:image" content="https://www.inconsarq.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="INCONSARQ — Ingeniería, Construcción y Arquitectura" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:site_name" content="INCONSARQ" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.inconsarq.com/" />
    <meta name="twitter:title" content="INCONSARQ — Ingeniería, Construcción y Arquitectura" />
    <meta name="twitter:description" content="Especialistas en geosintéticos, HDPE, obras civiles y consultoría. Arequipa, Perú." />
    <meta name="twitter:image" content="https://www.inconsarq.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="INCONSARQ — Ingeniería, Construcción y Arquitectura" />

    <!--
      JSON-LD: la empresa (GeneralContractor, un tipo de LocalBusiness) y el sitio.
      El catálogo de servicios repite los títulos de src/config/services.js:
      si se agrega o renombra un servicio, actualizarlo también acá.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "GeneralContractor",
          "@id": "https://www.inconsarq.com/#organization",
          "name": "INCONSARQ",
          "alternateName": "INCONSARQ — Ingeniería, Construcción y Arquitectura",
          "description": "Empresa especializada en geosintéticos, tuberías HDPE, supervisión de obras civiles, expedientes técnicos y saneamiento físico-legal en Perú.",
          "slogan": "Soluciones que brindan seguridad",
          "url": "https://www.inconsarq.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.inconsarq.com/apple-touch-icon.png",
            "width": 180,
            "height": 180
          },
          "image": "https://www.inconsarq.com/og-image.jpg",
          "telephone": "+51 940 850 179",
          "email": "comercial@inconsarq.com",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Mz. D Lt. 4 Dpto. 3, Res. CASABELLA",
            "addressLocality": "Cerro Colorado",
            "addressRegion": "Arequipa",
            "addressCountry": "PE"
          },
          "areaServed": {
            "@type": "Country",
            "name": "Perú"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "sales",
            "telephone": "+51 940 850 179",
            "email": "comercial@inconsarq.com",
            "areaServed": "PE",
            "availableLanguage": ["es"]
          },
          "knowsAbout": [
            "Geosintéticos",
            "Tuberías HDPE",
            "Termofusión",
            "Supervisión de obras",
            "Expedientes técnicos",
            "Saneamiento físico-legal",
            "Topografía",
            "Construcción civil",
            "Arquitectura"
          ],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Servicios de ingeniería y construcción",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Geosintéticos" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Servicios Misceláneos" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Tuberías HDPE" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Asesoramiento y Consultoría" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Ejecución Integral de Proyectos" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Supervisión de Obras" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Levantamiento Topográfico" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Expedientes Técnicos" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Saneamiento Físico-Legal" } }
            ]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.inconsarq.com/#website",
          "url": "https://www.inconsarq.com/",
          "name": "INCONSARQ",
          "inLanguage": "es-PE",
          "publisher": { "@id": "https://www.inconsarq.com/#organization" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Esta web requiere JavaScript para funcionar. Por favor habilítalo en tu navegador.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
